version: 1.0
runtime: python-3
build:
  commands:
    - pip install -r requirements.txt
run:
  command: uvicorn api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: MOCK_AWS
      value: "False"
    - name: AWS_REGION
      value: "us-east-1"
    - name: S3_BUCKET_NAME
      value: "virtual-cmo-raw-signals"
    - name: BEDROCK_MODEL_ID
      value: "anthropic.claude-3-5-sonnet-20241022-v2:0"
